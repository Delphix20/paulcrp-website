<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Paul CRP App Development Studio</title>
  <desc id="description">Paul CRP creates thoughtful iOS applications, smart tools, wellness products, productivity apps and engaging games.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="30" x2="1100" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c7d8ff"/>
      <stop offset="0.36" stop-color="#dde0e6"/>
      <stop offset="0.66" stop-color="#e0d7ff"/>
      <stop offset="1" stop-color="#b5ffe7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(940 130) rotate(136) scale(470 350)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="35" flood-color="#244c7a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="80" cy="560" r="220" fill="#fff" fill-opacity="0.2"/>
  <circle cx="1130" cy="560" r="180" fill="#5db4ff" fill-opacity="0.12"/>
  <rect x="82" y="72" width="1036" height="486" rx="54" fill="#fff" fill-opacity="0.43" stroke="#fff" stroke-opacity="0.72" filter="url(#shadow)"/>
  <g fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="150" y="208" font-size="82" font-weight="700" letter-spacing="-3">PAUL CRP</text>
    <rect x="150" y="241" width="138" height="4" rx="2" fill="#244c7a"/>
    <text x="150" y="326" font-size="42" font-weight="700">App Development Studio</text>
    <text x="150" y="393" font-size="27" font-weight="600" fill="#244c7a">Thoughtful iOS apps that make everyday life simpler.</text>
    <text x="150" y="466" font-size="23" font-weight="600" fill="#5f7188">Wellness  ·  Productivity  ·  Smart Tools  ·  Games</text>
  </g>
  <g transform="translate(915 195)">
    <rect width="118" height="118" rx="31" fill="#fff" fill-opacity="0.58" stroke="#fff" stroke-opacity="0.85"/>
    <text x="59" y="52" text-anchor="middle" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" font-weight="700">PAUL</text>
    <path d="M25 64h68" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="59" y="91" text-anchor="middle" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="700" letter-spacing="7">CRP</text>
  </g>
</svg>
